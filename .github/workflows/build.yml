name: Build Windows exe
 
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: write  # needed only for attaching the exe to tagged releases
 
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: dtolnay/rust-toolchain@stable
 
      - uses: Swatinem/rust-cache@v2
 
      - name: Build release
        run: cargo build --release --locked
 
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: autobright-windows-x64
          path: target/release/autobright.exe
          if-no-files-found: error
 
      - name: Attach exe to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/autobright.exe
 
